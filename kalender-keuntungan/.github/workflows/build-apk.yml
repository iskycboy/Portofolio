# Build APK otomatis di GitHub — tanpa perlu Android Studio.
# Cara pakai: unggah proyek ini ke repo GitHub, lalu buka tab
# Actions -> "Build APK" -> Run workflow. APK hasil build muncul
# sebagai artifact "kalender-keuntungan-debug-apk" di halaman run.
name: Build APK

on:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install dependencies
              run: npm ci || npm install

            - name: Add Android platform (bila folder android belum ada di repo)
              run: if [ ! -d android ]; then npx cap add android; fi

            - name: Sync Capacitor
              run: npx cap sync android

            - name: Build debug APK
              working-directory: android
              run: ./gradlew assembleDebug

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: kalender-keuntungan-debug-apk
                  path: android/app/build/outputs/apk/debug/app-debug.apk
